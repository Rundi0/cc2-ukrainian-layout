name: windows

on:
  push:
    branches: [main]
    paths-ignore:
      - 'windows/amd64/**'
      - 'windows/i386/**'
      - 'windows/built-from.sha256'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: regenerate and fail if the committed source is stale
        shell: bash
        run: |
          python3 gen.py
          git diff --exit-code -- windows/src/uacc.c out/ windows/uacc.reg windows/expected.tsv \
            || { echo "::error::gen.py output differs from what is committed"; exit 1; }

      # Built with MSVC, not mingw.  A mingw -shared build produces a PE with
      # .text/.rdata/.pdata/.idata/.edata and a writable .data; win32k refused
      # it -- LoadKeyboardLayout returned NULL while stock layouts loaded fine
      # in the same process.  These are the flags MSKLC and winkbdlayouts use.
      # vcvarsall.bat refuses to run twice in one shell, so one step per arch.
      - name: build amd64
        shell: cmd
        run: |
          call windows\src\build.cmd x64 amd64 0x180000000

      - name: build i386
        shell: cmd
        run: |
          call windows\src\build.cmd x86 i386 0x10000000

      - name: verify the DLLs
        shell: bash
        run: python3 windows/src/verify-pe.py windows/amd64/uacc.dll windows/i386/uacc.dll

      - name: stamp and commit
        shell: bash
        run: |
          python3 windows/src/stamp.py > windows/built-from.sha256
          if git diff --quiet -- windows/; then
            echo "DLLs unchanged, nothing to commit"; exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add windows/amd64/uacc.dll windows/i386/uacc.dll windows/built-from.sha256
          git commit -m "windows: rebuild uacc.dll from $(git rev-parse --short HEAD) [skip ci]"
          git push
