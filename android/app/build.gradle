plugins { id 'com.android.application' }

android {
    namespace 'ua.cc2.layout'
    compileSdk 34
    defaultConfig {
        applicationId 'ua.cc2.layout'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // A checked-in debug key, so every CI build carries the same signature and
    // installs as an update instead of failing with a signature mismatch.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storeType 'PKCS12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}
